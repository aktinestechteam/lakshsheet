<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Resource Planner</title>

    <link rel="stylesheet" href="css/style.css" />

    <!-- Bootstrap 5 -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr"
      crossorigin="anonymous"
    />

    <!-- Font Awesome 6 -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />

    <!-- Luckysheet CSS -->
    <link href="css/luckysheet-tokens.css" rel="stylesheet" />
    <link href="lib/luckysheet/css/pluginscss.css" rel="stylesheet" />
    <link href="lib/luckysheet/css/plugins.css" rel="stylesheet" />
    <link
      href="lib/luckysheet/css/luckysheet.css"
      rel="stylesheet"
      asp-append-version="true"
    />
    <link href="lib/luckysheet/css/iconfont.css" rel="stylesheet" />

    <!-- Modern Toolbar Theme (CSS-only, loads last to win the cascade) -->
    <link rel="stylesheet" href="css/luckysheet-modern-toolbar.css?v=2" />

    <!-- Modern Grid Chrome Theme (headers/selection/freeze overlays) -->
    <link rel="stylesheet" href="css/luckysheet-modern-grid.css?v=2" />

    <!-- Modern Sheet Tab Bar Theme (sheets section, zoom cluster, tab menu) -->
    <link rel="stylesheet" href="css/luckysheet-modern-sheets.css?v=2" />

    <!-- Modern Dialog Theme (modals, masks, slider drawers, dialog buttons) -->
    <link rel="stylesheet" href="css/luckysheet-modern-dialogs.css?v=2" />

    <!-- Print view switcher (Normal / Page Layout / Page Break Preview) -->
    <link rel="stylesheet" href="css/luckysheet-modern-printview.css?v=1" />

    <!-- AI Assistant chat sidebar -->
    <link rel="stylesheet" href="plugins/ai-assistant/ai-assistant.css?v=1" />

    <!-- Element UI CSS -->
    <link
      rel="stylesheet"
      href="https://unpkg.com/element-ui/lib/theme-chalk/index.css"
    />

    <!-- Modern Luckysheet UI Overrides (CSS-only, no logic changes) -->
    <!-- <link rel="stylesheet" href="css/luckysheet-modern.css" /> -->

    <!-- jQuery (required by Luckysheet) -->
  </head>

  <body>
    <!-- ========== LOADING SCREEN ========== -->
    <div class="loading-screen" id="loadingScreen">
      <div class="loading-content">
        <div class="loading-logo">
          <i class="fa-solid fa-table-cells-large"></i>
        </div>
        <div class="loading-spinner">
          <div class="loading-spinner-ring"></div>
          <div class="loading-spinner-ring loading-spinner-ring--inner"></div>
        </div>
        <p class="loading-text">Loading Resource Planner...</p>
        <p class="loading-subtext">Initializing spreadsheet engine</p>
      </div>
    </div>

    <!-- ========== MAIN LAYOUT ========== -->
    <div class="app-layout">
      <!-- ========== MAIN CONTENT AREA ========== -->
      <main class="main-content" role="main">
        <!-- Spreadsheet Container -->
        <div class="spreadsheet-wrapper">
          <div class="spreadsheet-container" id="spreadsheetContainer">
            <div id="luckysheet"></div>
            <button
              type="button"
              class="btn btn-sm btn-light spreadsheet-fixbar-btn"
              id="fixSheetBarBtn"
              title="Re-measure the spreadsheet to show the sheet tab bar"
            >
              <i class="fa-solid fa-table-cells"></i> Show Sheet Bar
            </button>
          </div>
        </div>
      </main>
    </div>

    <!-- ========== SCRIPTS ========== -->
    <!-- jQuery - ONLY ONCE -->
    <script src="lib/luckysheet/js/jquery-3.7.1.min.js"></script>

    <!-- Other dependencies -->
    <script src="expendPlugins/exportXlsx/exceljs.min.js"></script>
    <script src="expendPlugins/exportXlsx/FileSaver.min.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/fflate@0.8.0/umd/index.js"></script>

    <!-- Luckysheet -->
    <script src="lib/luckysheet/js/plugin.js"></script>

    <!-- Grid line color shim (must load BEFORE luckysheet.umd.js renders) -->
    <script src="js/grid-line-theme.js?v=2"></script>
    <script src="lib/luckysheet/js/luckysheet.umd.js?v=10"></script>
    <script src="js/print-view.js?v=1"></script>

    <!-- Chart dependencies -->
    <script src="expendPlugins/chart/vue.min.js"></script>
    <script src="expendPlugins/chart/vuex.min.js"></script>
    <script src="expendPlugins/chart/echarts.min.js"></script>
    <script src="expendPlugins/chart/chartmix.umd.min.js"></script>
    <script src="expendPlugins/chart/chart.js"></script>
    <script src="expendPlugins/exportXlsx/exceljs.min.js"></script>
    <script src="expendPlugins/exportXlsx/FileSaver.min.js"></script>
    <!-- Application -->
    <!-- <script src="js/sampleData.json"></script> -->
    <script src="data/generated-sheets_v2.json"></script>
    <script src="js/grouping.js"></script>
    <script src="js/app.js?v=7"></script>

    <!-- ========== CAPABILITY LAYER (window.ls) ========== -->
    <!-- Core kernel (order matters: each registers onto window.LsyCore) -->
    <script src="plugins/luckysheet-extension/core/errors.js"></script>
    <script src="plugins/luckysheet-extension/core/schemas.js"></script>
    <script src="plugins/luckysheet-extension/core/capabilityRegistry.js"></script>
    <script src="plugins/luckysheet-extension/core/executor.js"></script>
    <script src="plugins/luckysheet-extension/core/events.js"></script>
    <script src="plugins/luckysheet-extension/core/changeInfo.js"></script>
    <script src="plugins/luckysheet-extension/core/adapter.js"></script>
    <script src="plugins/luckysheet-extension/core/index.js"></script>

    <!-- Capability modules (helpers must load first) -->
    <script src="plugins/luckysheet-extension/modules/_helpers.js"></script>
    <script src="plugins/luckysheet-extension/modules/workbook.js"></script>
    <script src="plugins/luckysheet-extension/modules/sheet.js"></script>
    <script src="plugins/luckysheet-extension/modules/cell.js"></script>
    <script src="plugins/luckysheet-extension/modules/range.js"></script>
    <script src="plugins/luckysheet-extension/modules/rowcolumn.js"></script>
    <script src="plugins/luckysheet-extension/modules/formatting.js"></script>
    <script src="plugins/luckysheet-extension/modules/formula.js"></script>
    <script src="plugins/luckysheet-extension/modules/calculation.js"></script>
    <script src="plugins/luckysheet-extension/modules/search.js"></script>
    <script src="plugins/luckysheet-extension/modules/sort.js"></script>
    <script src="plugins/luckysheet-extension/modules/filter.js"></script>
    <script src="plugins/luckysheet-extension/modules/merge.js"></script>
    <script src="plugins/luckysheet-extension/modules/selection.js"></script>
    <script src="plugins/luckysheet-extension/modules/clipboard.js"></script>
    <script src="plugins/luckysheet-extension/modules/history.js"></script>
    <script src="plugins/luckysheet-extension/modules/freeze.js"></script>
    <script src="plugins/luckysheet-extension/modules/view.js"></script>
    <script src="plugins/luckysheet-extension/modules/validation.js"></script>
    <script src="plugins/luckysheet-extension/modules/conditionalformat.js"></script>
    <script src="plugins/luckysheet-extension/modules/hyperlink.js"></script>
    <script src="plugins/luckysheet-extension/modules/comment.js"></script>
    <script src="plugins/luckysheet-extension/modules/image.js"></script>
    <script src="plugins/luckysheet-extension/modules/chart.js"></script>
    <script src="plugins/luckysheet-extension/modules/importexport.js"></script>
    <script src="plugins/luckysheet-extension/modules/configuration.js"></script>
    <script src="plugins/luckysheet-extension/modules/events.js"></script>
    <script src="plugins/luckysheet-extension/modules/plugins.js"></script>
    <script src="plugins/luckysheet-extension/modules/app.js"></script>
    <script src="plugins/luckysheet-extension/index.js"></script>
    <script src="plugins/luckysheet-extension/bootstrap.js"></script>

    <!-- ========== AI ASSISTANT (chat sidebar) ========== -->
    <script src="plugins/ai-assistant/config.js"></script>
    <script src="plugins/ai-assistant/tools.js"></script>
    <script src="plugins/ai-assistant/llm.js"></script>
    <script src="plugins/ai-assistant/systemPrompt.js"></script>
    <script src="plugins/ai-assistant/agent.js"></script>
    <script src="plugins/ai-assistant/ui.js"></script>
    <script src="plugins/ai-assistant/index.js"></script>
    <script>
      // Mount the chat sidebar once the capability layer (window.ls) is ready.
      window.AiAssistant.mount();
    </script>
    <script>
      document.addEventListener("keydown", function (e) {
        if (e.ctrlKey && e.key.toLowerCase() === "c") {
          console.log("CTRL+C detected");
          console.log("luckysheet:", document.getElementById("luckysheet"));
          console.log(
            "luckysheet HTML length:",
            document.getElementById("luckysheet")?.innerHTML.length,
          );
        }
      });
    </script>
  </body>
</html>
